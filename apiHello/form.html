<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Formulário API</title>
</head>
<body>
    <h1>Formulário de Teste API</h1>

    <h3>Versão 1 (v1)</h3>
    <form id="greetFormV1" action="http://localhost:8000/v1/hi" method="post">
        <div class="form-group">
            <label for="name-v1">Seu Nome:</label>
            <input type="text" id="name-v1" name="name" required placeholder="Digite seu nome">
        </div>
        <button type="submit">Enviar Saudação v1</button>
    </form>

    <hr>

    <h3>Versão 2 (v2)</h3>
    <form id="greetFormV2" action="http://localhost:8000/v2/hi" method="post">
        <div class="form-group">
            <label for="name-v2">Seu Nome:</label>
            <input type="text" id="name-v2" name="name" required placeholder="Digite seu nome">
        </div>
        <div class="form-group">
            <label for="lang">Idioma:</label>
            <select id="lang" name="lang">
                <option value="pt-br">Português</option>
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
        </div>
        <button type="submit">Enviar Saudação v2</button>
    </form>
</body>
</html>
